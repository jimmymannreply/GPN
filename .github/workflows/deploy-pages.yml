name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build all variants (base matches repo name for GitHub Pages)
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          npm run build --if-present
          npx tsc -b
          npx vite build --base "$BASE"
          npx vite build --mode v2 --base "${BASE}v2/" --outDir dist/v2
          npx vite build --mode v3 --base "${BASE}v3/" --outDir dist/v3
      - run: cp dist/index.html dist/404.html
      - run: cp dist/v2/index.html dist/v2/404.html
      - run: cp dist/v3/index.html dist/v3/404.html
      # SPA deep links on project Pages (custom 404 is not enabled)
      - run: mkdir -p dist/hackathon/journey && cp dist/index.html dist/hackathon/index.html && cp dist/index.html dist/hackathon/journey/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
